<div class="theme-picker {{ theme_picker_class }}" data-theme-picker>
  <span class="theme-picker-label">{{ theme_label|default:"外观主题" }}</span>
  <div class="theme-options" role="group" aria-label="{{ theme_label|default:'外观主题' }}">
    <button type="button" class="theme-option" data-theme-value="light" aria-pressed="false"><i class="theme-swatch light-swatch" aria-hidden="true"></i>{{ theme_light|default:"亮色" }}</button>
    <button type="button" class="theme-option" data-theme-value="dark" aria-pressed="true"><i class="theme-swatch dark-swatch" aria-hidden="true"></i>{{ theme_dark|default:"暗色" }}</button>
  </div>
</div>
