<div class="subscription-rule-row{% if kind == 'dns' %} subscription-dns-row{% endif %}" data-rule-row="{{ kind }}">
  <label class="subscription-rule-match" data-rule-match-fallback>匹配方式<select name="{{ kind }}_match"><option value="suffix"{% if not rule or rule.match == 'suffix' %} selected{% endif %}>域名及子域名</option><option value="exact"{% if rule.match == 'exact' %} selected{% endif %}>仅此域名</option>{% if kind == 'direct' %}<option value="cidr"{% if rule.match == 'cidr' %} selected{% endif %}>IP / 网段</option>{% endif %}</select></label>
  {% if kind == 'direct' %}<div class="subscription-rule-type-picker" data-rule-type-picker hidden><span>直连目标</span><div class="subscription-rule-types" role="group" aria-label="直连目标类型"><button type="button" data-rule-type="domain" aria-pressed="{% if rule.match == 'cidr' %}false{% else %}true{% endif %}">域名</button><button type="button" data-rule-type="cidr" aria-pressed="{% if rule.match == 'cidr' %}true{% else %}false{% endif %}">IP / 网段</button></div></div>{% endif %}
  <div class="subscription-rule-target"><label><span data-rule-value-label>{% if rule.match == 'cidr' %}IP / 网段{% else %}域名{% endif %}</span><input name="{{ kind }}_value" value="{{ rule.value|default:'' }}" required maxlength="253" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="{% if rule.match == 'cidr' %}192.168.50.10{% else %}example.com{% endif %}"></label><label class="subscription-rule-subdomains" data-rule-subdomains hidden><input type="checkbox" data-rule-subdomains-toggle{% if not rule or rule.match == 'suffix' %} checked{% endif %}{% if rule.match == 'cidr' %} disabled{% endif %}>包含子域名</label><small data-rule-value-help>{% if rule.match == 'cidr' %}网段示例：192.168.50.0/24{% elif rule.match == 'exact' %}只匹配填写的域名。{% else %}同时匹配此域名及其子域名。{% endif %}</small></div>
  {% if kind == 'dns' %}
  <label class="subscription-rule-route">DNS 路径<select name="dns_route"><option value="PROXY"{% if not rule or rule.route == 'PROXY' %} selected{% endif %}>走出口</option><option value="MID"{% if rule.route == 'MID' %} selected{% endif %}>走 VPS（MID）</option><option value="DIRECT"{% if rule.route == 'DIRECT' %} selected{% endif %}>本机直连</option></select></label>
  <label class="subscription-rule-servers">DNS 地址<textarea name="dns_servers" rows="2" required maxlength="2052" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://8.8.8.8/dns-query">{{ rule.servers|join:', ' }}</textarea><small>换行或逗号分隔。出口 / VPS 需公网 IP 的 HTTPS DoH；直连也支持数字 IP。</small></label>
  {% include "dashboard/_subscription_dns_path.html" %}
  {% endif %}
  <button class="copy-button danger-quiet subscription-rule-remove" type="button" data-rule-remove hidden aria-label="移除此条{% if kind == 'dns' %} DNS{% else %}直连{% endif %}规则">移除</button>
</div>
