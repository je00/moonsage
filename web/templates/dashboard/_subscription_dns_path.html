<div class="subscription-dns-notice" data-rule-route-notice data-route="{{ rule.route|default:'PROXY' }}" aria-live="polite"><strong data-rule-route-preview>{% if rule.route == 'DIRECT' %}客户端 → 指定 DNS（不走代理）{% else %}客户端 → 当前代理出口 → 指定 DNS{% endif %}</strong><span data-rule-route-help>{% if rule.route == 'DIRECT' %}从设备直连，不是让 VPS 代查；这些域名不再走统一 DNS 出口。{% else %}随客户端 PROXY 组的选择切换。{% endif %}</span></div>
